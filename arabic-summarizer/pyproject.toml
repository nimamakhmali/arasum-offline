[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "arabic-summarizer"
version = "0.1.0"
description = "Offline Arabic Text Summarization Module"
authors = [
    { name = "BitForge Team", email = "contact@bitforge.ir" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["arabic", "nlp", "summarization", "offline", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "torch>=2.3.1",
    "transformers>=4.41.2",
    "tokenizers>=0.19.1",
    "onnxruntime>=1.18.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.3",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.4",
    "nltk>=3.8.1",
    "rouge-score>=0.1.2",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
ui = ["gradio>=4.36.1"]
train = [
    "peft>=0.11.1",
    "accelerate>=0.31.0",
    "bitsandbytes>=0.43.1",
    "datasets>=2.19.2",
    "optimum>=1.20.0",
    "bert-score>=0.3.13",
]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "flake8>=7.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
arabic-summarizer = "arabic_summarizer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist"]