# ══════════════════════════════════════════════════════════
# تنظیمات Fine-Tuning فاز ۲
# اصلاح: مسیر dataset به training_ready تغییر کرد
# ══════════════════════════════════════════════════════════

model:
  base_model_id: "moussaKam/AraBART"
  tokenizer_id: "moussaKam/AraBART"
  max_source_length: 1024
  max_target_length: 128

dataset:
  # اصلاح مهم: مسیر واقعی داده آماده‌شده
  processed_dir: "data/training_ready"
  source_name: "xlsum_arabic"
  train_file: "train.jsonl"
  validation_file: "validation.jsonl"
  test_file: "test.jsonl"
  text_field: "text"
  summary_field: "summary"
  max_train_samples: null
  max_eval_samples: null
  max_test_samples: null

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  bias: "none"
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "out_proj"
  task_type: "SEQ_2_SEQ_LM"

training:
  output_dir: "models/finetuned/arabart"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  # GPU: اینها در runtime بر اساس GPU تنظیم می‌شوند
  fp16: false
  bf16: false
  gradient_checkpointing: true
  seed: 42
  dataloader_num_workers: 2
  # ارزیابی: steps به جای epoch برای checkpoint بهتر
  evaluation_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  load_best_model_at_end: true
  metric_for_best_model: "rougeL"
  greater_is_better: true
  save_total_limit: 3
  logging_dir: "reports/training/logs"
  logging_steps: 100
  report_to: "none"
  early_stopping_patience: 2
  predict_with_generate: true
  generation_max_length: 128
  generation_num_beams: 4
  # Resume از checkpoint
  resume_from_checkpoint: null

generation:
  num_beams: 4
  early_stopping: true
  no_repeat_ngram_size: 3
  length_penalty: 1.0
  repetition_penalty: 1.2
  min_new_tokens: 20
  max_new_tokens: 128

evaluation:
  bertscore_model: "bert-base-multilingual-cased"
  bertscore_max_samples: 500
  qualitative_samples: 10
  benchmark_input_lengths: [300, 500, 1000, 1500, 2000]
  benchmark_warmup_runs: 2
  benchmark_timed_runs: 5

known_constraints:
  xlsum_avg_compression_ratio: 0.052
  product_target_compression_min: 0.10
  product_target_compression_max: 0.30
  strategy: >
    آموزش روی reference summaries اصلی XL-Sum.
    طول خروجی با generation constraints کنترل می‌شود.